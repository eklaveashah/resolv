name: Resolv checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RESOLV_ML_HOME: ${{ runner.temp }}/resolv-tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r MLModel/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: Backend
      - run: python -m unittest discover -s tests -v
        working-directory: MLModel
      - run: python scripts/check_js.py
